<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --border: #E2E5EA;
    --ink: #171A21;
    --ink-soft: #667085;
    --ink-faint: #98A2B3;
    --accent: #2451B3;
    --accent-hover: #1C3F93;
    --user-bubble: #E9EFFC;
    --code-bg: #F1F3F6;
    --pine: #157A4D;
    --pine-bg: #E7F5EE;
    --amber: #91610A;
    --amber-bg: #FBF2E1;
    --rust: #A32E1F;
    --rust-bg: #FCEBE9;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", sans-serif;
    font-size: 15.5px;
    line-height: 1.55;
    overflow: hidden; /* only the chat pane scrolls */
  }

  /* ---------- header ---------- */

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: center; gap: 9px; }

  .brand svg { flex: 0 0 auto; }

  .brand span {
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-soft); }

  .status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-faint);
    flex: 0 0 auto;
  }
  .status.ok .dot { background: var(--pine); }
  .status.down .dot { background: var(--rust); }
  .status.down { color: var(--rust); max-width: 420px; text-align: right; }

  /* ---------- chat area ---------- */

  main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }

  .chat {
    max-width: 780px;
    margin: 0 auto;
    padding: 26px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .empty-state {
    margin: 15vh auto 0;
    text-align: center;
    color: var(--ink-faint);
    max-width: 320px;
    font-size: 14.5px;
  }
  .empty-state svg { margin-bottom: 10px; opacity: .6; }

  .turn { display: flex; }
  .turn.user { justify-content: flex-end; }
  .turn.assistant { justify-content: flex-start; }

  .bubble-user {
    max-width: 75%;
    background: var(--user-bubble);
    color: var(--ink);
    padding: 10px 15px;
    border-radius: 16px 16px 4px 16px;
    font-size: 15px;
  }

  .card-assistant {
    max-width: 88%;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px;
    padding: 15px 17px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    margin-bottom: 2px;
  }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
  .pill.ran     { background: var(--pine-bg);  color: var(--pine); }
  .pill.ran::before { background: var(--pine); }
  .pill.refused { background: var(--amber-bg); color: var(--amber); }
  .pill.refused::before { background: var(--amber); }
  .pill.failed  { background: var(--rust-bg);  color: var(--rust); }
  .pill.failed::before { background: var(--rust); }

  .row-count { font-size: 13px; color: var(--ink-soft); margin-left: 2px; }

  .reasons {
    margin: 10px 0 0;
    padding-left: 18px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .reasons li { margin-bottom: 2px; }

  pre.sql {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    background: var(--code-bg);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 11px 0 0;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: #262B33;
  }

  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table { border-collapse: collapse; width: auto; max-width: 100%; }
  th, td {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    text-align: left;
    padding: 6px 28px 6px 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th:last-child, td:last-child { padding-right: 0; }
  th { font-weight: 500; color: var(--ink-soft); border-bottom-color: var(--ink-soft); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .truncated-note { font-size: 12.5px; color: var(--ink-faint); margin-top: 6px; }

  details.sources { margin-top: 11px; font-size: 13.5px; }
  details.sources summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }
  details.sources summary::-webkit-details-marker { display: none; }
  details.sources summary::before { content: '›  '; }
  details.sources[open] summary::before { content: '⌄  '; }
  details.sources summary:hover { color: var(--accent); }
  .source-item { border-left: 2px solid var(--border); padding: 2px 0 2px 11px; margin: 10px 0; }
  .source-meta { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-faint); }
  .source-item pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    margin: 4px 0 0;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .typing { display: flex; gap: 4px; padding: 3px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-faint);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; opacity: .6; }
  }

  /* ---------- input bar ---------- */

  footer {
    flex: 0 0 auto;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
  }

  form {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #question {
    flex: 1;
    font-family: inherit;
    font-size: 15px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--bg);
    color: var(--ink);
  }
  #question::placeholder { color: var(--ink-faint); }
  #question:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(36, 81, 179, 0.12);
  }

  button#ask-button {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  button#ask-button:hover:not(:disabled) { background: var(--accent-hover); }
  button#ask-button:disabled { opacity: .45; cursor: progress; }
  button#ask-button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  @media (max-width: 640px) {
    .bubble-user, .card-assistant { max-width: 90%; }
    header { padding: 12px 16px; }
    .status.down { max-width: 220px; font-size: 12px; }
    footer { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect x="2" y="3" width="16" height="14" rx="2.5" stroke="#2451B3" stroke-width="1.5"/>
      <path d="M2 7.5H18" stroke="#2451B3" stroke-width="1.5"/>
      <circle cx="5.2" cy="5.25" r=".6" fill="#2451B3"/>
      <circle cx="7.2" cy="5.25" r=".6" fill="#2451B3"/>
    </svg>
    <span>SQL Analyst</span>
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">Checking…</span></div>
</header>

<main>
  <div class="chat" id="chat">
    <div class="empty-state" id="empty-state">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3C7 3 3 6.6 3 11c0 2.4 1.2 4.5 3.1 6L5 21l4.3-1.7c.9.2 1.8.3 2.7.3 5 0 9-3.6 9-8s-4-8.6-9-8.6Z" stroke="#98A2B3" stroke-width="1.4"/></svg>
      <div>Ask a question about the HR dataset to get started.</div>
    </div>
  </div>
</main>

<footer>
  <form id="ask-form">
    <input id="question" type="text" autocomplete="off"
           placeholder='Ask about your data — e.g. "Which department had the highest attrition in 2024?"'
           aria-label="Ask a question about your data">
    <button type="submit" id="ask-button" aria-label="Ask">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="10.5" cy="10.5" r="6.5" stroke="white" stroke-width="1.8"/>
        <path d="M20 20L15.2 15.2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </form>
</footer>

<script>
const VERDICTS = {
  success:                   { cls: "ran",     label: "Ran successfully" },
  fallback_ambiguous:        { cls: "refused", label: "Declined to answer" },
  fallback_invalid_sql:      { cls: "failed",  label: "Blocked by validation" },
  fallback_execution_error:  { cls: "failed",  label: "Failed while running" }
};

const chat = document.getElementById("chat");
const emptyState = document.getElementById("empty-state");
const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const button = document.getElementById("ask-button");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function scrollToBottom() {
  const pane = chat.parentElement; // <main>, the scrollable pane
  requestAnimationFrame(() => { pane.scrollTop = pane.scrollHeight; });
}

function renderTable(result) {
  if (!result || !result.columns.length) return "";
  const numeric = result.columns.map((_, i) =>
    result.rows.some(r => r[i] !== null) &&
    result.rows.every(r => r[i] === null || typeof r[i] === "number"));

  const head = result.columns.map((c, i) =>
    `<th class="${numeric[i] ? "num" : ""}">${esc(c)}</th>`).join("");
  const body = result.rows.map(r =>
    `<tr>${r.map((v, i) =>
      `<td class="${numeric[i] ? "num" : ""}">${v === null ? "—" : esc(v)}</td>`).join("")}</tr>`).join("");
  const note = result.truncated
    ? `<p class="truncated-note">Showing first ${result.rows.length} of ${result.total_rows} rows.</p>` : "";
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${note}`;
}

function renderSources(chunks) {
  if (!chunks || !chunks.length) return "";
  const items = chunks.map(c => `
    <div class="source-item">
      <div class="source-meta">${esc(c.source)} · ${esc(c.type)} · similarity ${esc(c.score)}</div>
      <pre>${esc(c.text)}</pre>
    </div>`).join("");
  return `<details class="sources"><summary>Sources (${chunks.length})</summary>${items}</details>`;
}

function userTurn(question) {
  const el = document.createElement("div");
  el.className = "turn user";
  el.innerHTML = `<div class="bubble-user">${esc(question)}</div>`;
  return el;
}

function pendingTurn() {
  const el = document.createElement("div");
  el.className = "turn assistant";
  el.innerHTML = `<div class="card-assistant"><div class="typing"><span></span><span></span><span></span></div></div>`;
  return el;
}

function assistantCardHTML(data) {
  const v = VERDICTS[data.status] || { cls: "failed", label: data.status };
  const rowCount = data.result ? data.result.total_rows : 0;
  const countText = data.status === "success"
    ? `<span class="row-count">${rowCount} row${rowCount === 1 ? "" : "s"}</span>` : "";

  const reasons = (data.reasons && data.reasons.length)
    ? `<ul class="reasons">${data.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "";
  const sql = data.sql ? `<pre class="sql">${esc(data.sql)}</pre>` : "";

  return `
    <div class="card-assistant">
      <span class="pill ${v.cls}">${esc(v.label)}</span>${countText}
      ${reasons}
      ${sql}
      ${data.status === "success" ? renderTable(data.result) : ""}
      ${renderSources(data.context_used)}
    </div>`;
}

function errorCardHTML(message) {
  return `
    <div class="card-assistant">
      <span class="pill failed">Couldn't run</span>
      <ul class="reasons"><li>${esc(message)}</li></ul>
    </div>`;
}

async function checkHealth() {
  const el = document.getElementById("status");
  const text = document.getElementById("status-text");
  try {
    const s = await (await fetch("/api/status")).json();
    const problems = [];
    if (!s.database.ok) problems.push("database unreachable");
    if (!s.ollama.ok) problems.push("Ollama unreachable");
    if (!s.index.ok) problems.push("search index not built");

    if (problems.length) {
      el.className = "status down";
      text.textContent = problems.join(", ");
      return;
    }
    el.className = "status ok";
    text.textContent = s.model;
  } catch (e) {
    el.className = "status down";
    text.textContent = "can't reach server";
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  if (emptyState) emptyState.remove();

  chat.appendChild(userTurn(question));
  const pending = pendingTurn();
  chat.appendChild(pending);
  scrollToBottom();

  input.value = "";
  button.disabled = true;

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    pending.innerHTML = res.ok ? assistantCardHTML(data) : errorCardHTML(data.error || "Unknown error");
  } catch (err) {
    pending.innerHTML = errorCardHTML("Lost connection to the server.");
  } finally {
    button.disabled = false;
    input.focus();
    scrollToBottom();
  }
});

checkHealth();
</script>
</body>
</html>
